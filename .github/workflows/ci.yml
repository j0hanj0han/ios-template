name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Aussi sur main : un cache créé sur main est lisible par toutes les PR,
    # alors que celui d'une PR ne sert qu'à elle.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bundle exec fastlane test

  beta:
    # Activé une fois la signature configurée par /setup-ci (variable de repo SIGNING_READY=true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGNING_READY == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bundle exec fastlane beta
        env:
          APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_READY == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bundle exec fastlane release
        env:
          APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
