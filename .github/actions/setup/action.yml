name: Setup
description: Xcode, Ruby (Gemfile.lock) et Mint (Mintfile)
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "27.2"
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - uses: actions/cache@v4
      with:
        path: ~/.mint
        key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}
    - shell: bash
      run: brew install mint
