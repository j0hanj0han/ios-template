name: AppTemplate

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Monetization:
    path: Packages/Monetization
  FeatureHome:
    path: Packages/FeatureHome

targets:
  AppTemplate:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Monetization
      - package: FeatureHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apptemplate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppTemplate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  # Tests d'intégration qui ont besoin de l'app hôte (StoreKitTest).
  AppTemplateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      - path: Packages/Monetization/StoreKit/Products.storekit
        buildPhase: resources
    dependencies:
      - target: AppTemplate
      - package: Core
      - package: Monetization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apptemplate.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le header SKTestTransaction.h du SDK utilise une API StoreKit 1 dépréciée :
        # sans ça, -Werror fait échouer la précompilation du module StoreKitTest.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-deprecated-declarations

schemes:
  AppTemplate:
    build:
      targets:
        AppTemplate: all
    test:
      gatherCoverageData: true
      targets:
        - package: Core/CoreTests
        - package: Monetization/MonetizationTests
        - package: FeatureHome/FeatureHomeTests
    run:
      config: Debug
      storeKitConfiguration: Packages/Monetization/StoreKit/Products.storekit
    archive:
      config: Release
  # Test d'achat StoreKitTest, à lancer en local : hors CI, car le premier achat
  # bloque sur un simulateur neuf (voir docs/architecture.md).
  AppTemplatePurchases:
    build:
      targets:
        AppTemplate: all
    test:
      targets:
        - AppTemplateTests
